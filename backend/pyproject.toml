[project]
name = "visual-lens-backend"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141.1,<1.0",
  "uvicorn[standard]>=0.53.0,<1.0",
  "playwright>=1.62.0,<2.0",
  "python-dotenv>=1.2.3,<2.0",
  # Exact-pinned: litellm 1.101.0 ships prebuilt wheels for Python 3.14
  # (cp310-abi3, requires-python <3.15,>=3.10). Unlike 1.83.7, it no longer
  # exact-pins its own dependency tree (pydantic/httpx/python-dotenv/etc.
  # are plain ranges), so the dependabot ignore list for those packages
  # has been removed — see .github/dependabot.yml.
  "litellm==1.101.0",
  "pydantic>=2.13.5,<3.0",
  "httpx>=0.28.1,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10.0",
]
