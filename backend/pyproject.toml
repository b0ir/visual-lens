[project]
name = "visual-lens-backend"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.140.13,<1.0",
  "uvicorn[standard]>=0.52.0,<1.0",
  "playwright>=1.62.0,<2.0",
  "python-dotenv>=1.0.1,<2.0",
  # Exact-pinned: litellm 1.83.7 is the newest release with Python 3.14 wheel
  # support (1.92.0+ declares Requires-Python <3.14 and only ships as an
  # sdist requiring a Rust toolchain to build on 3.14). litellm also
  # exact-pins its own dependency tree (pydantic, python-dotenv, httpx,
  # aiohttp, openai, jinja2) — see the dependabot ignore list below.
  "litellm==1.97.0",
  "pydantic>=2.12.5,<3.0",
  "httpx>=0.28.1,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10.0",
]
