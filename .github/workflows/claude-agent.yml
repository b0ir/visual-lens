name: Claude Agent

# On-demand agent: mention "@claude <instruction>" in any issue/PR comment
# (e.g. "@claude review", "@claude fix the failing test"), or apply the
# `agent` label to an issue. Replaces the old 30-min issue-monitor polling.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]

jobs:
  agent:
    # Anti-abuse gate: only the repo owner / collaborators can trigger.
    # Strangers commenting "@claude" on the public repos exit here at zero cost.
    # (claude-code-action additionally verifies write access itself.)
    if: >
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.labels.*.name, 'agent')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: "agent"
